<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" shape-rendering="crispEdges">
  <rect width="400" height="200" fill="#ECE9D8" stroke="#808080" stroke-width="2"/>
  
  <!-- Дороги -->
  <rect x="20" y="80" width="360" height="30" fill="#B4B4B4" stroke="#646464"/>
  <rect x="160" y="20" width="30" height="160" fill="#B4B4B4" stroke="#646464"/>
  
  <!-- Здания -->
  <rect x="40" y="20" width="100" height="40" fill="#C8A078" stroke="#000000"/>
  <text x="90" y="44" font-family="Tahoma, Arial" font-size="10" font-weight="bold" text-anchor="middle">м. Радиорынок</text>
  
  <rect x="210" y="20" width="150" height="40" fill="#A0C878" stroke="#000000"/>
  <text x="285" y="44" font-family="Tahoma, Arial" font-size="10" font-weight="bold" text-anchor="middle">ул. Компьютерная</text>
  
  <rect x="210" y="130" width="150" height="50" fill="#DC6464" stroke="#000000"/>
  <text x="285" y="160" font-family="Tahoma, Arial" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">МАСТЕРСКАЯ (оф. 204)</text>
  
  <!-- Маршрут -->
  <path d="M 90 95 L 285 95 L 285 125" fill="none" stroke="#FF0000" stroke-width="4" stroke-dasharray="6,4"/>
  <polygon points="285,130 280,120 290,120" fill="#FF0000"/>
</svg>